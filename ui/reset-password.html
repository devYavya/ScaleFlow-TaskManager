<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleFlow - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-container {
            background: white;
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo i { font-size: 48px; color: #667eea; background: #e0e7ff; padding: 16px; border-radius: 20px; }
        .logo h1 { font-size: 28px; margin-top: 16px; color: #1e293b; }
        .input-group { margin-bottom: 24px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #1e293b; }
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .btn-reset {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-reset:hover { transform: translateY(-2px); }
        .btn-back {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: #f1f5f9;
            color: #64748b;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .message.success { background: #dcfce7; color: #166534; display: block; }
        .message.error { background: #fee2e2; color: #991b1b; display: block; }
        .message.info { background: #dbeafe; color: #1e40af; display: block; }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <i class="fas fa-key"></i>
            <h1>Reset Password</h1>
            <p>Create a new secure password</p>
        </div>

        <div id="messageBox" class="message"></div>

        <form id="resetForm">
            <div class="input-group">
                <label>New Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                </div>
            </div>

            <button type="submit" class="btn-reset">
                <i class="fas fa-sync-alt"></i> Reset Password
            </button>
        </form>

        <button class="btn-back" onclick="goToLogin()">
            <i class="fas fa-arrow-left"></i> Back to Login
        </button>
    </div>

    <script>
        const API_URL = 'https://task-tracker.scaleflowsoftware.com/api';
        
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        let email = urlParams.get('email');
        let token = urlParams.get('token');
        
        let isSetupMode = !token && email;
        
        if (isSetupMode) {
            document.querySelector('.logo p').textContent = 'Set your password to activate your account';
            showMessage('Please set your password to activate your account.', 'info');
        } else if (!token && !email) {
            showMessage('No reset token found. Please request a new password reset.', 'error');
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            if (password !== confirm) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            const resetBtn = document.querySelector('.btn-reset');
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="loading"></span> Processing...';
            
            try {
                let response;
                
                if (isSetupMode) {
                    // First time setup
                    response = await fetch(`${API_URL}/auth/setup-account`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                } else {
                    // Password reset with token
                    response = await fetch(`${API_URL}/auth/reset-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, token, newPassword: password })
                    });
                }
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Password reset successful! Redirecting to login...', 'success');
                    
                    // Save token if returned
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        setTimeout(() => {
                            if (data.user.role === 'admin') {
                                window.location.href = '/admin';
                            } else if (data.user.role === 'developer') {
                                window.location.href = '/developer';
                            } else {
                                window.location.href = '/login.html';
                            }
                        }, 2000);
                    } else {
                        setTimeout(() => {
                            window.location.href = '/login.html';
                        }, 2000);
                    }
                } else {
                    showMessage(data.error || 'Failed to reset password', 'error');
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Reset Password';
                }
            } catch (error) {
                console.error('Reset error:', error);
                showMessage('Connection error. Please try again.', 'error');
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Reset Password';
            }
        });

        function showMessage(message, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.className = `message ${type}`;
            setTimeout(() => {
                if (type !== 'error') {
                    messageBox.style.display = 'none';
                }
            }, 5000);
        }

        function goToLogin() {
            window.location.href = '/login.html';
        }
    </script>
    <style>
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
