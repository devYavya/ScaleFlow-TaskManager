<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleFlow - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo i {
            font-size: 48px;
            color: #667eea;
            background: #e0e7ff;
            padding: 16px;
            border-radius: 20px;
        }

        .logo h1 {
            font-size: 28px;
            margin-top: 16px;
            color: #1e293b;
        }

        .logo p {
            color: #64748b;
            font-size: 14px;
            margin-top: 8px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1e293b;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .btn-reset {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 20px;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }

        .btn-reset:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-back {
            width: 100%;
            padding: 14px;
            background: #f1f5f9;
            color: #64748b;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-back:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .message.info {
            background: #dbeafe;
            color: #1e40af;
            display: block;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
        }

        .strength-weak { color: #ef4444; }
        .strength-medium { color: #f59e0b; }
        .strength-strong { color: #10b981; }

        .requirements {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .requirements h4 {
            margin-bottom: 8px;
            color: #1e293b;
        }

        .requirements ul {
            list-style: none;
            padding-left: 0;
        }

        .requirements li {
            margin-bottom: 4px;
            color: #64748b;
        }

        .requirements li.valid {
            color: #10b981;
        }

        .requirements li.invalid {
            color: #ef4444;
        }

        .requirements i {
            margin-right: 8px;
            width: 16px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <i class="fas fa-key"></i>
            <h1>Reset Password</h1>
            <p>Create a new secure password</p>
        </div>

        <div id="messageBox" class="message"></div>

        <form id="resetForm">
            <div class="input-group">
                <label>New Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                </div>
                <div id="passwordStrength" class="password-strength"></div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                </div>
            </div>

            <div class="requirements">
                <h4>Password Requirements:</h4>
                <ul>
                    <li id="reqLength"><i class="fas fa-circle"></i> At least 6 characters</li>
                    <li id="reqLower"><i class="fas fa-circle"></i> At least one lowercase letter</li>
                    <li id="reqUpper"><i class="fas fa-circle"></i> At least one uppercase letter</li>
                    <li id="reqNumber"><i class="fas fa-circle"></i> At least one number</li>
                </ul>
            </div>

            <button type="submit" class="btn-reset" id="resetBtn">
                <i class="fas fa-sync-alt"></i> Reset Password
            </button>
        </form>

        <button class="btn-back" onclick="goToLogin()">
            <i class="fas fa-arrow-left"></i> Back to Login
        </button>
    </div>

    <script>
        const API_URL = 'https://scaleflow-taskmanager.onrender.com/api';

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        let email = urlParams.get('email');
        let token = urlParams.get('token');
        
        let isValidToken = false;

        // Check if we have email and token
        if (!email && !token) {
            showMessage('No reset token found. Please request a new password reset.', 'error');
            document.getElementById('resetForm').style.display = 'none';
        } else {
            validateToken();
        }

        async function validateToken() {
            try {
                // This endpoint would check if the token is valid
                // For now, we'll assume it's valid if we have both params
                if (email && token) {
                    isValidToken = true;
                    showMessage('Please enter your new password below.', 'info');
                } else if (email) {
                    // If only email is provided (from invitation)
                    isValidToken = true;
                    showMessage('Please set your password to activate your account.', 'info');
                } else {
                    showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
                    document.getElementById('resetForm').style.display = 'none';
                }
            } catch (error) {
                showMessage('Invalid or expired reset token. Please request a new password reset.', 'error');
                document.getElementById('resetForm').style.display = 'none';
            }
        }

        // Password validation and strength meter
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const passwordStrength = document.getElementById('passwordStrength');

        newPassword.addEventListener('input', function() {
            validatePasswordStrength(this.value);
            checkPasswordMatch();
        });

        confirmPassword.addEventListener('input', checkPasswordMatch);

        function validatePasswordStrength(password) {
            const requirements = {
                length: password.length >= 6,
                lower: /[a-z]/.test(password),
                upper: /[A-Z]/.test(password),
                number: /[0-9]/.test(password)
            };

            // Update requirement indicators
            document.getElementById('reqLength').className = requirements.length ? 'valid' : 'invalid';
            document.getElementById('reqLower').className = requirements.lower ? 'valid' : 'invalid';
            document.getElementById('reqUpper').className = requirements.upper ? 'valid' : 'invalid';
            document.getElementById('reqNumber').className = requirements.number ? 'valid' : 'invalid';

            // Update icons
            updateRequirementIcon('reqLength', requirements.length);
            updateRequirementIcon('reqLower', requirements.lower);
            updateRequirementIcon('reqUpper', requirements.upper);
            updateRequirementIcon('reqNumber', requirements.number);

            // Calculate strength
            const strength = Object.values(requirements).filter(Boolean).length;
            
            if (password.length === 0) {
                passwordStrength.innerHTML = '';
                passwordStrength.className = 'password-strength';
            } else if (strength <= 2) {
                passwordStrength.innerHTML = 'Weak password';
                passwordStrength.className = 'password-strength strength-weak';
            } else if (strength === 3) {
                passwordStrength.innerHTML = 'Medium password';
                passwordStrength.className = 'password-strength strength-medium';
            } else {
                passwordStrength.innerHTML = 'Strong password';
                passwordStrength.className = 'password-strength strength-strong';
            }

            return strength === 4;
        }

        function updateRequirementIcon(elementId, isValid) {
            const element = document.getElementById(elementId);
            const icon = element.querySelector('i');
            if (isValid) {
                icon.className = 'fas fa-check-circle';
            } else {
                icon.className = 'fas fa-circle';
            }
        }

        function checkPasswordMatch() {
            const password = newPassword.value;
            const confirm = confirmPassword.value;
            
            if (confirm.length > 0 && password !== confirm) {
                confirmPassword.style.borderColor = '#ef4444';
                return false;
            } else {
                confirmPassword.style.borderColor = '#e2e8f0';
                return true;
            }
        }

        // Handle form submission
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = newPassword.value;
            const confirm = confirmPassword.value;
            
            // Validate password
            if (!validatePasswordStrength(password)) {
                showMessage('Please meet all password requirements', 'error');
                return;
            }
            
            if (password !== confirm) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            // Disable button and show loading
            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="loading"></span> Resetting password...';
            
            try {
                let response;
                
                if (token) {
                    // Reset password with token
                    response = await fetch(`${API_URL}/auth/reset-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            token: token,
                            newPassword: password
                        })
                    });
                } else if (email) {
                    // First time setup (from invitation)
                    // You might need to implement a setup endpoint
                    response = await fetch(`${API_URL}/auth/setup-account`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });
                }
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Password reset successful! Redirecting to login...', 'success');
                    
                    // Clear any stored tokens
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    sessionStorage.removeItem('token');
                    sessionStorage.removeItem('user');
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showMessage(data.error || 'Failed to reset password', 'error');
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Reset Password';
                }
            } catch (error) {
                console.error('Reset error:', error);
                showMessage('Connection error. Please try again.', 'error');
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Reset Password';
            }
        });

        function showMessage(message, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.className = `message ${type}`;
            
            // Auto-hide after 5 seconds for success/info
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    messageBox.style.display = 'none';
                    messageBox.className = 'message';
                }, 5000);
            }
        }

        function goToLogin() {
            window.location.href = '/login.html';
        }

        // Add enter key support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('resetForm').style.display !== 'none') {
                document.getElementById('resetForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
